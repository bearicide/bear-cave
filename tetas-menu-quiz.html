<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATTBEAR – Teta's Menu Quiz</title><style>:root{--ink:#201d18;--paper:#f5efe2;--red:#9e2f27;--green:#365b3a;--gold:#c79b45}*{box-sizing:border-box}body{margin:0;background:#ded5c5;color:var(--ink);font-family:system-ui,Segoe UI,sans-serif}header{background:var(--ink);color:#fff;padding:22px 18px;border-bottom:6px solid var(--gold)}.wrap{max-width:850px;margin:auto}.brand{font:700 30px Georgia,serif}.sub{opacity:.8;margin-top:4px}main{padding:18px}.panel{background:var(--paper);border:2px solid var(--ink);padding:20px;box-shadow:7px 7px 0 #8e8372;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}.stat{background:#fff;border:1px solid #999;padding:10px;text-align:center}.stat b{display:block;font-size:21px}button{font:inherit;font-weight:700;border:2px solid var(--ink);background:#fff;padding:12px 14px;cursor:pointer}.answer{width:100%;text-align:left;margin:6px 0}.correct{background:#cfe8ce!important}.wrong{background:#f0c7c3!important}#q{font:700 23px Georgia,serif;margin:8px 0 18px}.tag{display:inline-block;background:var(--green);color:#fff;padding:5px 8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}#feedback{min-height:52px;padding-top:12px;font-weight:650}.controls{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--red);color:#fff}.mode.on{background:var(--gold)}.small{font-size:13px;opacity:.72}.progress{height:9px;background:#ccc;margin:14px 0}.bar{height:100%;background:var(--green);width:0}.back{color:#fff;text-decoration:none;display:inline-block;margin-bottom:8px}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.brand{font-size:25px}#q{font-size:20px}}</style></head><body><header><div class="wrap"><a class="back" href="./">← Bear Cave</a><div class="brand">TETA'S GRILL • MENU TRAINER</div><div class="sub">Cook-side study quiz • dishes, ingredients, combos & house standards</div></div></header><main class="wrap"><div class="panel"><div class="controls"><button class="mode on" data-mode="all">Mixed</button><button class="mode" data-mode="ingredients">Ingredients</button><button class="mode" data-mode="menu">Menu</button><button class="mode" data-mode="standards">Standards</button></div></div><div class="stats"><div class="stat"><b id="score">0</b>Score</div><div class="stat"><b id="streak">0</b>Streak</div><div class="stat"><b id="right">0</b>Right</div><div class="stat"><b id="asked">0</b>Asked</div></div><div class="panel"><span class="tag" id="cat">MENU</span><div class="progress"><div class="bar" id="bar"></div></div><div id="q"></div><div id="answers"></div><div id="feedback"></div><div class="controls"><button class="primary" id="next" disabled>Next Question →</button><button id="restart">Reset Score</button></div></div><div class="panel small"><b>Study note:</b> Built from Teta's published menu/site. Restaurant menus change, so use Sam's current in-house recipes and portion specs as the final authority.</div></main><script>const Q=[["ingredients","What goes on the Chicken Tawook sandwich?","Garlic, tomato & pickle",["Tahini, parsley & onion","Garlic, tomato & pickle","Hummus, lettuce & pickle","Sumac, onion & tomato"],"Tawook keeps it simple: garlic, tomato, pickle."],["ingredients","What goes on the Chicken Shawarma sandwich?","Garlic, tomato & pickle",["Garlic, tomato & pickle","Tahini, parsley & onion","Fattoush & hummus","Onion, parsley & tahini"],"Chicken shawarma: garlic, tomato, pickle."],["ingredients","Tenderloin Lamb Kabob sandwich includes…","Tomato, onion, parsley, garlic & tahini",["Tomato, onion, parsley, garlic & tahini","Garlic, pickle & tomato","Parsley, pickle & tahini","Hummus, tomato & sumac"],"Lamb kabob gets tomato, onion, parsley, garlic and tahini."],["ingredients","The Vegan Falafel sandwich includes…","Tomato, parsley, pickles & tahini",["Tomato, parsley, pickles & tahini","Tomato, garlic & feta","Onion, rice & garlic","Pickles, hummus & chicken"],"Falafel: tomato, parsley, pickles, tahini."],["menu","A sandwich combo is served with soup or salad plus…","Rice or fries",["Rice or fries","Hummus only","Pita chips only","Tabbouleh only"],"Published combo format: soup or salad + rice or fries."],["menu","Plate combos are served with pita, soup or salad, and…","Rice or fries",["Rice or fries","Only hummus","Only fries","Dessert"],"Plate combo: pita + soup/salad + rice/fries."],["standards","How long does Teta's say it marinates its meat?","At least 24 hours",["2 hours","Overnight if convenient","At least 24 hours","48 hours exactly"],"House site says all meat is marinated for 24 hours, no less."],["standards","What does Teta's use instead of powdered citric acid?","Fresh-squeezed lemon",["Vinegar powder","Fresh-squeezed lemon","Lime concentrate","MSG"],"Fresh lemon is a recurring house standard."],["standards","Which statement matches Teta's published kitchen standard?","Everything is prepared fresh daily",["Most sauces arrive premade","Everything is prepared fresh daily","Meat is precooked each morning","Salads are weekly batch prep"],"Fresh-daily preparation is central to the operation."],["standards","Teta's garlic dip is published as…","Dairy-free and gluten-free",["Made with mayonnaise","Dairy-free and gluten-free","Made with butter","Nut-based"],"Their garlic dip is dairy- and gluten-free."],["standards","How long does Teta's say six liters of garlic dip takes to make?","About one hour",["10 minutes","30 minutes","About one hour","Three hours"],"An hour for six liters."],["ingredients","Teta's describes Kafta as ground beef or lamb mixed with…","Onion, parsley, allspice, black pepper & salt",["Onion, parsley, allspice, black pepper & salt","Garlic, yogurt, tomato & cumin","Rice, chickpeas & bulgur","Lemon, sumac & mint"],"Those are the ingredients listed in Teta's kafta description."],["ingredients","Tabbouleh is described with parsley, tomatoes, cracked wheat, onions and…","Lemon juice, olive oil, garlic & salt",["Lemon juice, olive oil, garlic & salt","Tahini, cumin & pickles","Yogurt, mint & butter","Sumac, mayo & garlic"],"Lemon, olive oil, garlic and salt."],["ingredients","Vegetarian grape leaves are stuffed with…","Rice, bulgur & chickpeas",["Rice, bulgur & chickpeas","Lamb and rice","Kafta and parsley","Falafel and hummus"],"Published description: rice, bulgur and chickpeas."],["menu","Which sandwich is marked a top seller on the published menu?","Chicken Shawarma",["Kafta","Chicken Shawarma","Falafel","Chicken Tawook"],"Chicken Shawarma is marked Top Seller."],["standards","Teta's says its meat is…","Halal",["Kosher","Halal","Vegan","Pre-cooked"],"All meat is advertised as Halal."],["standards","For celiac/gluten-free customers, falafel or fries can be…","Cooked in a separate dedicated fryer by request",["Microwaved","Cooked in a separate dedicated fryer by request","Served only cold","Never ordered"],"The customer must specifically request the separate fryer."],["menu","Which two categories are stated as NOT gluten-free on the current site?","Chicken Fingers and desserts",["Kafta and rice","Chicken Fingers and desserts","Shawarma and hummus","Falafel and fries"],"The site currently identifies Chicken Fingers and desserts as the exceptions."]];let mode="all",score=0,streak=0,right=0,asked=0,current=null,locked=false;const $=x=>document.getElementById(x);function pool(){return mode==="all"?Q:Q.filter(x=>x[0]===mode)}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function draw(){locked=false;$('next').disabled=true;$('feedback').textContent='';current=pool()[Math.floor(Math.random()*pool().length)];$('cat').textContent=current[0];$('q').textContent=current[1];$('answers').innerHTML='';shuffle(current[3]).forEach(a=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>answer(b,a);$('answers').appendChild(b)});$('bar').style.width=((asked%10)*10)+'%'}function answer(btn,a){if(locked)return;locked=true;asked++;[...document.querySelectorAll('.answer')].forEach(b=>{b.disabled=true;if(b.textContent===current[2])b.classList.add('correct')});if(a===current[2]){right++;streak++;score+=10+Math.min(streak,10);$('feedback').textContent='✓ Correct. '+current[4]}else{streak=0;btn.classList.add('wrong');$('feedback').textContent='✗ Correct answer: '+current[2]+'. '+current[4]}$('score').textContent=score;$('streak').textContent=streak;$('right').textContent=right;$('asked').textContent=asked;$('next').disabled=false}$('next').onclick=draw;$('restart').onclick=()=>{score=streak=right=asked=0;['score','streak','right','asked'].forEach(x=>$(x).textContent=0);draw()};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;draw()});draw();</script></body></html>
