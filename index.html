<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Basement</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-700 text-gray-100 overflow-hidden selection:bg-yellow-300/30">
  <header class="sticky top-0 z-40 bg-gray-800/80 border-b border-gray-600 backdrop-filter backdrop-blur">
    <div class="max-w-6xl mx-auto flex items-center justify-between px-4 py-3 gap-3">
      <div class="flex items-center gap-2">
        <svg xmlns='http://www.w3.org/2000/svg' class="h-5 w-5 text-yellow-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
        <span class="font-semibold tracking-wide">the basement</span>
      </div>
      <div class="flex items-center gap-2">
        <a href="guitar-tuner.html" class="inline-flex items-center rounded-full bg-yellow-400 px-3 py-1.5 text-xs font-bold text-gray-900 hover:bg-yellow-300">🎸 guitar tuner</a>
        <div class="hidden sm:block text-xs text-gray-300">client-side only • dusty shelves, flickering light</div>
      </div>
    </div>
  </header>

  <main id="scene" class="relative min-h-screen">
    <div class="swing origin-top absolute left-1/2 top-6 flex flex-col items-center">
      <div class="h-28 w-0.5 bg-gray-400"></div>
      <div class="h-10 w-10 rounded-full bg-yellow-300 shadow-light"></div>
    </div>

    <div class="decor box" style="left:25%; top:72%; transform: rotate(-4deg)"></div>
    <div class="decor box" style="left:45%; top:76%; transform: rotate(6deg)"></div>
    <div class="decor box" style="left:68%; top:82%; transform: rotate(-8deg)"></div>
    <div class="decor paint" style="left:72%; top:68%;"></div>
    <div class="decor paper" style="left:32%; top:74%; transform: rotate(-9deg)"></div>
    <div class="decor paper" style="left:52%; top:80%; transform: rotate(14deg)"></div>
    <div class="decor paper" style="left:63%; top:86%; transform: rotate(-6deg)"></div>

    <section class="mx-auto max-w-6xl px-4 pt-10 pb-24">
      <div class="relative rounded-2xl border-2 border-gray-500 bg-gray-600/70 shadow-inner p-6">
        <h1 class="text-2xl font-semibold text-yellow-300">drop files anywhere</h1>
        <p class="text-sm text-gray-200 mb-4">they’ll scatter across the basement like relics of creation</p>
        <div class="flex gap-2">
          <label class="inline-flex cursor-pointer items-center gap-2 rounded-lg bg-gray-600 px-3 py-2 text-sm font-medium ring-1 ring-gray-400 hover:ring-yellow-400/60">
            <input id="file-input" type="file" multiple class="hidden" />
            <span class="inline-flex items-center gap-2">
              <svg xmlns='http://www.w3.org/2000/svg' class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              choose files
            </span>
          </label>
          <button id="clear-some" class="inline-flex items-center gap-2 rounded-lg bg-yellow-500/80 px-3 py-2 text-sm font-semibold text-gray-900 hover:bg-yellow-400">
            clear a little
          </button>
          <button id="export-list" class="inline-flex items-center gap-2 rounded-lg bg-gray-700 px-3 py-2 text-sm font-medium ring-1 ring-gray-500 hover:ring-yellow-400/60">
            export list
          </button>
        </div>
        <div id="stats" class="mt-3 text-xs text-gray-200"></div>
      </div>
    </section>
  </main>

  <label class="fixed bottom-5 right-5 opacity-30 hover:opacity-90 transition-opacity cursor-pointer z-50">
    <input id="corner-file-input" type="file" multiple class="hidden" />
    <div class="h-12 w-12 flex items-center justify-center rounded-full bg-gray-600 ring-1 ring-gray-400 hover:ring-yellow-400/60 shadow-lg">
      <svg xmlns='http://www.w3.org/2000/svg' class="h-5 w-5 text-yellow-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </div>
  </label>

  <footer class="border-t border-gray-500/60 bg-gray-700/70 py-8 text-center text-xs text-gray-200">
    the basement — shelves creak, light swings, paint drips, papers fall, and data lingers.
  </footer>

  <script src="script.js"></script>
</body>
</html>
