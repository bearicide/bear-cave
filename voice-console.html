<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATTBEAR – Voice Console</title><style>:root{--cyan:#28f4e6;--orange:#ff7b32;--panel:#121a19;--display:Rockwell,'Rockwell Extra Bold','Roboto Slab','DejaVu Serif',Georgia,serif;--body:'Segoe UI',Tahoma,sans-serif;--mono:'Cascadia Mono',Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07100f,#111,#070909);color:#d9efea;font-family:var(--body)}.wrap{max-width:1180px;margin:auto;padding:15px}.head{border:2px solid #35534e;padding:15px;background:#0c1413}.head h1{margin:0;font-family:var(--display);font-size:clamp(25px,5vw,48px);font-weight:900;letter-spacing:-1px;color:#fff;text-transform:uppercase;text-shadow:2px 2px 0 #123b35,0 0 16px #28f4e633}.head p,.status,#read{font-family:var(--mono)}.head p{color:#7ca69f}.screen{margin-top:12px;border:2px solid #2d5c55;background:#07100e;box-shadow:inset 0 0 30px #002d28;padding:12px}.wave{height:120px;background:repeating-linear-gradient(90deg,transparent 0 7px,#28f4e622 8px),linear-gradient(transparent 49%,#28f4e6 50%,transparent 51%);position:relative;overflow:hidden}.wave:after{content:'';position:absolute;inset:20% 0;background:linear-gradient(90deg,transparent,#28f4e6,transparent);clip-path:polygon(0 50%,5% 30%,10% 70%,15% 15%,20% 80%,25% 35%,30% 62%,35% 22%,40% 77%,45% 40%,50% 55%,55% 10%,60% 85%,65% 30%,70% 65%,75% 20%,80% 75%,85% 42%,90% 58%,95% 30%,100% 50%,100% 52%,0 52%)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}.panel{border:2px solid #314944;background:var(--panel);padding:12px}.panel h2{margin:0 0 10px;color:var(--cyan);font-family:var(--display);font-size:17px;font-weight:900;letter-spacing:.5px}.scenes,.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{min-height:55px;background:#182522;border:2px solid #3d625b;color:#eafffb;font-family:var(--display);font-weight:900;cursor:pointer}button.on{background:var(--cyan);color:#001b18;box-shadow:0 0 18px #28f4e688}.orange{border-color:#8c482b}.macro{padding:8px;border:1px solid #36534e;margin:7px 0}.macro label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px}.macro input{width:100%;accent-color:var(--orange)}.xy{height:320px;border:2px solid #3a6e65;touch-action:none;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#fff 0 1%,var(--orange) 2% 4%,transparent 5%),repeating-linear-gradient(0deg,transparent 0 31px,#28f4e620 32px),repeating-linear-gradient(90deg,#07100e 0 31px,#28f4e620 32px)}.nav{display:flex;gap:8px;margin-top:12px}.nav a{flex:1;text-align:center;padding:13px;background:#172320;border:2px solid #35534e;color:#fff;text-decoration:none;font-family:var(--display);font-weight:900}.status{color:var(--orange)}@media(max-width:700px){.grid{grid-template-columns:1fr}.scenes,.macros{grid-template-columns:repeat(2,1fr)}.xy{height:42vh}.nav{flex-direction:column}}</style></head><body><main class="wrap"><header class="head"><h1>MATTBEAR – VOICE CONSOLE</h1><p>PERFORMANCE-FIRST CONTROL SURFACE // less laboratory, more playable instrument</p><b class="status" id="status">STANDBY // SELECT A SCENE</b></header><section class="screen"><div class="wave"></div></section><section class="grid"><div><section class="panel"><h2>SCENE BANK</h2><div class="scenes" id="scenes"></div></section><section class="panel" style="margin-top:12px"><h2>MACRO CONTROLS</h2><div class="macros"><div class="macro"><label>CHARACTER <span id="a">35</span></label><input type="range" value="35" data-v="a"></div><div class="macro"><label>MOTION <span id="b">20</span></label><input type="range" value="20" data-v="b"></div><div class="macro"><label>SPACE <span id="c">25</span></label><input type="range" value="25" data-v="c"></div><div class="macro"><label>CHAOS <span id="d">0</span></label><input type="range" value="0" data-v="d"></div></div></section></div><section class="panel"><h2>GESTURE SURFACE</h2><div class="xy" id="xy"></div><p id="read">X: 50 // Y: 50</p><button id="motion" style="width:100%">● RECORD MOTION</button></section></section><section class="panel" style="margin-top:12px"><h2>MOMENTARY PERFORMANCE</h2><div class="scenes"><button>STUTTER</button><button class="orange">TAPE MELT</button><button>FREEZE</button><button class="orange">SPACE THROW</button><button>ROBOT</button><button>MONSTER</button><button>CRUSH</button><button class="orange">CHAOS</button></div></section><nav class="nav"><a href="microphone-fiend.html">← MIC FIEND INDEX</a><a href="voice-arcade.html">VOICE ARCADE →</a></nav></main><script>const names=['CLEAN','BROADCAST','PHONE','MEGAPHONE','DUB','ROBOT','MONSTER','DREAM'];let s=document.querySelector('#scenes');s.innerHTML=names.map(n=>`<button>${n}</button>`).join('');s.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelector('#status').textContent='SCENE '+b.textContent+' // ARMED'});document.querySelectorAll('[data-v]').forEach(x=>x.oninput=()=>document.querySelector('#'+x.dataset.v).textContent=x.value);let xy=document.querySelector('#xy'),dn=false;function mv(e){let r=xy.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));xy.style.setProperty('--x',x*100+'%');xy.style.setProperty('--y',y*100+'%');document.querySelector('#read').textContent=`X: ${Math.round(x*100)} // Y: ${Math.round(y*100)}`}xy.onpointerdown=e=>{dn=true;xy.setPointerCapture(e.pointerId);mv(e)};xy.onpointermove=e=>dn&&mv(e);xy.onpointerup=xy.onpointercancel=()=>dn=false;document.querySelectorAll('.panel button:not(#motion)').forEach(b=>{if(b.parentElement!==s){b.onpointerdown=()=>b.classList.add('on');b.onpointerup=b.onpointercancel=()=>b.classList.remove('on')}});let m=false;document.querySelector('#motion').onclick=e=>{m=!m;e.target.classList.toggle('on',m);e.target.textContent=m?'■ STOP MOTION':'● RECORD MOTION'}</script></body></html>
