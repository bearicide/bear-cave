name: Package Bear Cave
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload full Bear Cave
        uses: actions/upload-artifact@v4
        with:
          name: MATTBEAR-Bear-Cave-Full
          path: |
            .
            !.git
          include-hidden-files: true
