<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07040d"><title>MATTBEAR Kaoss FX Rack</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@600;800&display=swap');
:root{--pink:#ff2b93;--cyan:#22edff;--gold:#ffd52f;--purple:#7424ff;--ink:#08050d;--panel:#151020;--x:50%;--y:50%}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07040d;color:#fff;font-family:'DM Sans',sans-serif}body{background:radial-gradient(circle at 50% 0,#4d1674 0,transparent 38%),linear-gradient(#09040e,#030205);background-attachment:fixed}.app{width:min(1200px,100%);margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.brand{font:clamp(1.35rem,4vw,2.8rem)/1 'Bungee';text-shadow:3px 3px #000}.brand b{color:var(--gold)}.status{border:2px solid #514167;border-radius:99px;padding:9px 14px;color:#c9bad6;background:#120d1b}.status.live{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 18px #22edff66}
button,select,input{font:inherit}.rack{border:4px solid var(--gold);border-radius:24px;padding:clamp(10px,2vw,22px);background:linear-gradient(145deg,#29113f,#0b0811 48%,#25103b);box-shadow:0 0 0 4px #71229b,0 0 38px #bb2dff77}.io{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-bottom:14px}.io select{min-width:0}.control,button,select{min-height:46px;border:2px solid #5d4a72;border-radius:10px;background:#171020;color:#fff;padding:10px 12px;font-weight:800}button{cursor:pointer;text-transform:uppercase}button.on{background:var(--cyan);color:#021317;border-color:#fff;box-shadow:0 0 18px #22edff88}button.danger{background:var(--pink);border-color:#ff8bc1}.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.8fr);gap:14px}.xy{position:relative;min-height:470px;border:4px solid #b696d0;border-radius:17px;overflow:hidden;touch-action:none;user-select:none;background:linear-gradient(90deg,transparent 49.7%,#ffffff25 50%,transparent 50.3%),linear-gradient(transparent 49.7%,#ffffff25 50%,transparent 50.3%),repeating-linear-gradient(0deg,#0b0810 0 39px,#20102d 40px 41px),repeating-linear-gradient(90deg,transparent 0 39px,#ffffff12 40px 41px);box-shadow:inset 0 0 45px #000,0 0 20px #7325a7}.xy:before{content:"FILTER →";position:absolute;left:12px;bottom:10px;color:#9686a1;font-size:.75rem}.xy:after{content:"DELAY ↑";position:absolute;right:10px;top:12px;color:#9686a1;font-size:.75rem}.orb{position:absolute;left:var(--x);top:var(--y);width:58px;height:58px;border-radius:50%;translate:-50% -50%;border:4px solid #fff;background:radial-gradient(circle,#fff 0 13%,var(--gold) 15% 28%,var(--pink) 31% 55%,var(--purple) 57%);box-shadow:0 0 8px #fff,0 0 28px var(--pink);pointer-events:none}.xyRead{position:absolute;left:14px;top:12px;font:1rem 'Bungee';color:var(--cyan);text-shadow:0 2px #000}.side{display:grid;gap:10px;align-content:start}.module{border:2px solid #463653;border-radius:14px;padding:11px;background:#0e0a14}.module h2{font:1rem 'Bungee';margin:0 0 9px;color:var(--gold)}.knobrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.knob label{display:flex;justify-content:space-between;color:#c9bcd2;font-size:.78rem;font-weight:800}.knob input{width:100%;accent-color:var(--pink)}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.presets button{padding:8px 4px;font-size:.75rem}.meter{height:14px;border:2px solid #514167;border-radius:99px;background:#050307;overflow:hidden;margin-top:8px}.meter i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--pink));transition:width .06s}.note{color:#a995b8;font-size:.82rem;line-height:1.35;margin:12px 2px 0}.note b{color:#fff}
@media(max-width:780px){.main{grid-template-columns:1fr}.xy{min-height:56vh}.io{grid-template-columns:1fr 1fr}.io select{grid-column:1/-1}.presets{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.app{padding:8px}.rack{padding:9px;border-radius:17px}.xy{min-height:52vh}.control,button,select{min-height:48px;padding:8px}.brand{font-size:1.35rem}}
</style>
</head>
<body><main class="app">
 <header class="top"><div class="brand"><b>MATTBEAR</b> KAOSS FX RACK</div><div id="status" class="status">INPUT OFF</div></header>
 <section class="rack">
  <div class="io"><select id="device" aria-label="Audio input"><option value="">DEFAULT AUDIO INPUT</option></select><button id="start" class="on">START INPUT</button><button id="kill" class="danger">KILL</button></div>
  <div class="main">
   <div id="xy" class="xy" aria-label="XY effect pad"><div class="xyRead"><span id="cutRead">6.0kHz</span> / <span id="delayRead">35%</span></div><div class="orb"></div></div>
   <div class="side">
    <section class="module"><h2>Input</h2><div class="knobrow"><div class="knob"><label>GAIN <span id="inVal">75%</span></label><input id="inputGain" type="range" min="0" max="150" value="75"></div><div class="knob"><label>OUTPUT <span id="outVal">70%</span></label><input id="outputGain" type="range" min="0" max="100" value="70"></div></div><div class="meter"><i id="meter"></i></div></section>
    <section class="module"><h2>Filter + Dirt</h2><div class="knobrow"><div class="knob"><label>RESONANCE <span id="resVal">35%</span></label><input id="res" type="range" min="0" max="100" value="35"></div><div class="knob"><label>DRIVE <span id="driveVal">22%</span></label><input id="drive" type="range" min="0" max="100" value="22"></div></div><div class="buttons"><button id="filterOn" class="on">FILTER ON</button><button id="driveOn" class="on">DRIVE ON</button></div></section>
    <section class="module"><h2>Space + Damage</h2><div class="knobrow"><div class="knob"><label>DELAY TIME <span id="timeVal">3/16</span></label><input id="delayTime" type="range" min="0" max="5" value="3"></div><div class="knob"><label>REVERB <span id="verbVal">24%</span></label><input id="reverb" type="range" min="0" max="100" value="24"></div></div><div class="buttons"><button id="freeze">FREEZE</button><button id="dub">DUB THROW</button></div></section>
   </div>
  </div>
  <div class="presets"><button data-p="clean">CLEAN</button><button data-p="acid">ACID MELT</button><button data-p="space">SPACE CAVE</button><button data-p="destroy">DESTROY</button></div>
  <p class="note"><b>Route:</b> Kaossilator audio out → computer/interface input → START INPUT. Use headphones to prevent speaker feedback. X controls filter cutoff; Y controls delay amount. Hold FREEZE or DUB THROW for momentary chaos.</p>
 </section>
</main>
<script>
const $=s=>document.querySelector(s);let ctx,stream,src,input,filter,shaper,dry,delay,feedback,wet,convolver,verbWet,comp,out,analyser,raf,active=false,padHeld=false,filterEnabled=true,driveEnabled=true;
function curve(n){let a=1+n*55,c=new Float32Array(2048);for(let i=0;i<c.length;i++){let x=i*2/c.length-1;c[i]=Math.tanh(x*a)/Math.tanh(a)}return c}
function impulse(){let len=ctx.sampleRate*2.4,b=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){let d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}return b}
function build(){ctx=new(window.AudioContext||window.webkitAudioContext)();input=ctx.createGain();filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=6000;filter.Q.value=6;shaper=ctx.createWaveShaper();shaper.oversample='4x';shaper.curve=curve(.22);dry=ctx.createGain();delay=ctx.createDelay(2);feedback=ctx.createGain();wet=ctx.createGain();convolver=ctx.createConvolver();convolver.buffer=impulse();verbWet=ctx.createGain();comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=8;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.12;out=ctx.createGain();out.gain.value=.7;analyser=ctx.createAnalyser();analyser.fftSize=256;input.connect(filter);filter.connect(shaper);shaper.connect(dry).connect(comp);shaper.connect(delay);delay.connect(feedback).connect(delay);delay.connect(wet).connect(comp);shaper.connect(convolver).connect(verbWet).connect(comp);comp.connect(out).connect(analyser).connect(ctx.destination);feedback.gain.value=.43;wet.gain.value=.35;delay.delayTime.value=.259;verbWet.gain.value=.24}
async function devices(){let ds=await navigator.mediaDevices.enumerateDevices(),sel=$('#device'),old=sel.value;sel.innerHTML='';ds.filter(d=>d.kind==='audioinput').forEach((d,i)=>sel.add(new Option(d.label||'AUDIO INPUT '+(i+1),d.deviceId)));if([...sel.options].some(o=>o.value===old))sel.value=old}
async function start(){try{if(!ctx)build();await ctx.resume();if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:$('#device').value?{exact:$('#device').value}:undefined,echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});src=ctx.createMediaStreamSource(stream);src.connect(input);out.gain.setTargetAtTime(+$('#outputGain').value/100,ctx.currentTime,.015);active=true;$('#start').textContent='INPUT LIVE';$('#status').textContent='LIVE INPUT • FX ARMED';$('#status').classList.add('live');await devices();meter()}catch(e){$('#status').textContent=e.name==='NotAllowedError'?'INPUT PERMISSION BLOCKED':'CHECK AUDIO INPUT';$('#status').classList.remove('live')}}
function kill(){active=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx)out.gain.setTargetAtTime(0,ctx.currentTime,.015);$('#start').textContent='START INPUT';$('#status').textContent='INPUT OFF';$('#status').classList.remove('live');cancelAnimationFrame(raf);$('#meter').style.width='0'}
function setPad(x,y){x=Math.max(0,Math.min(1,x));y=Math.max(0,Math.min(1,y));document.documentElement.style.setProperty('--x',x*100+'%');document.documentElement.style.setProperty('--y',(1-y)*100+'%');let hz=100*Math.pow(180,x),mix=y*.92;if(ctx){filter.frequency.setTargetAtTime(filterEnabled?hz:19000,ctx.currentTime,.02);wet.gain.setTargetAtTime(mix,ctx.currentTime,.02);feedback.gain.setTargetAtTime(Math.min(.88,.18+y*.7),ctx.currentTime,.025)}$('#cutRead').textContent=hz>=1000?(hz/1000).toFixed(1)+'kHz':Math.round(hz)+'Hz';$('#delayRead').textContent=Math.round(mix*100)+'%'}
function meter(){if(!active)return;let d=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(d);let v=Math.max(...d)/255;$('#meter').style.width=Math.min(100,v*135)+'%';raf=requestAnimationFrame(meter)}
const xy=$('#xy');function point(e){let r=xy.getBoundingClientRect();return[(e.clientX-r.left)/r.width,1-(e.clientY-r.top)/r.height]}xy.onpointerdown=e=>{xy.setPointerCapture(e.pointerId);padHeld=true;setPad(...point(e))};xy.onpointermove=e=>{if(padHeld)setPad(...point(e))};xy.onpointerup=xy.onpointercancel=()=>padHeld=false;
$('#start').onclick=start;$('#kill').onclick=kill;$('#device').onchange=()=>{if(active)start()};$('#inputGain').oninput=e=>{let v=+e.target.value;$('#inVal').textContent=v+'%';if(ctx)input.gain.setTargetAtTime(v/100,ctx.currentTime,.02)};$('#outputGain').oninput=e=>{let v=+e.target.value;$('#outVal').textContent=v+'%';if(ctx)out.gain.setTargetAtTime(v/100,ctx.currentTime,.02)};$('#res').oninput=e=>{let v=+e.target.value;$('#resVal').textContent=v+'%';if(ctx)filter.Q.setTargetAtTime(v/4,ctx.currentTime,.02)};$('#drive').oninput=e=>{let v=+e.target.value;$('#driveVal').textContent=v+'%';if(ctx)shaper.curve=curve(driveEnabled?v/100:0)};
$('#filterOn').onclick=e=>{filterEnabled=!filterEnabled;e.target.classList.toggle('on',filterEnabled);e.target.textContent='FILTER '+(filterEnabled?'ON':'OFF');if(ctx&&!filterEnabled)filter.frequency.setTargetAtTime(19000,ctx.currentTime,.02)};$('#driveOn').onclick=e=>{driveEnabled=!driveEnabled;e.target.classList.toggle('on',driveEnabled);e.target.textContent='DRIVE '+(driveEnabled?'ON':'OFF');if(ctx)shaper.curve=curve(driveEnabled?+$('#drive').value/100:0)};
let times=[.086,.129,.172,.259,.345,.517];$('#delayTime').oninput=e=>{let i=+e.target.value,labels=['1/16','1/16D','1/8','3/16','1/4','3/8'];$('#timeVal').textContent=labels[i];if(ctx)delay.delayTime.setTargetAtTime(times[i],ctx.currentTime,.02)};$('#reverb').oninput=e=>{let v=+e.target.value;$('#verbVal').textContent=v+'%';if(ctx)verbWet.gain.setTargetAtTime(v/100*.75,ctx.currentTime,.025)};
function moment(id,on,off){let b=$(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');if(ctx)on()};b.onpointerup=b.onpointercancel=()=>{b.classList.remove('on');if(ctx)off()}}
moment('#freeze',()=>{feedback.gain.setTargetAtTime(.985,ctx.currentTime,.01);wet.gain.setTargetAtTime(1,ctx.currentTime,.01)},()=>{feedback.gain.setTargetAtTime(.5,ctx.currentTime,.08);wet.gain.setTargetAtTime(.4,ctx.currentTime,.08)});moment('#dub',()=>{feedback.gain.setTargetAtTime(.82,ctx.currentTime,.01);delay.delayTime.setTargetAtTime(.129,ctx.currentTime,.01)},()=>{feedback.gain.setTargetAtTime(.43,ctx.currentTime,.12);delay.delayTime.setTargetAtTime(times[+$('#delayTime').value],ctx.currentTime,.12)});
const presets={clean:[.88,.05,8,0,.12],acid:[.72,.65,72,.28,.3],space:[.78,.2,55,.7,.72],destroy:[.58,1,94,.82,.48]};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{let p=presets[b.dataset.p];$('#inputGain').value=p[0]*100;$('#drive').value=p[1]*100;$('#res').value=p[2];$('#reverb').value=p[3]*100;['inputGain','drive','res','reverb'].forEach(id=>$('#'+id).dispatchEvent(new Event('input')));setPad(p[4],p[3]);document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x===b))});
window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
</script></body></html>
