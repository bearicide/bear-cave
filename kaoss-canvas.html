<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATTBEAR · TRI-OSC FX LAB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Source+Serif+4:wght@800&display=swap');
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#8fd3ff 0 18%,#dff7ff 34%,#8dcc7c 35%,#376e48 100%) fixed;color:#15384d;font-family:Nunito,Segoe UI,sans-serif}.wrap{max-width:1240px;margin:auto;padding:20px}.glass{background:#f7fdffe8;border:1px solid #fff;border-radius:22px;box-shadow:0 16px 40px #17415a44,inset 0 1px #fff;backdrop-filter:blur(18px);padding:16px;margin:14px 0}h1,h2{font-family:"Source Serif 4",Georgia,serif;margin:0}h1{font-size:clamp(32px,6vw,66px)}h2{font-size:25px}.top,.row,.banks{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.btn,select{border:1px solid #fff;border-radius:12px;padding:10px 13px;background:linear-gradient(#fff,#cfeaf7);box-shadow:0 5px 14px #17415a33;font-weight:900;color:#174a67}.btn{cursor:pointer}.btn.on{background:linear-gradient(#dfffd5,#86cf7b)}.oscgrid,.fxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.osc{border-radius:18px;padding:14px;background:linear-gradient(#eefaff,#c9e9f5);border:1px solid #fff}.osc:nth-child(2){background:linear-gradient(#f1ffe9,#cde7bd)}.osc:nth-child(3){background:linear-gradient(#fff9db,#e9dda7)}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ctl{min-width:0}.ctl label{display:flex;justify-content:space-between;font-size:10px;font-weight:900}.ctl input{width:100%;accent-color:#3c9ac8}.keys{display:flex;height:150px;overflow:hidden;border-radius:15px;border:2px solid #355c70}.key{flex:1;border:0;border-right:1px solid #789;background:#fff;position:relative;cursor:pointer}.key.black{background:#19394a;color:#fff;height:62%;margin:0 -1.4%;z-index:2;flex:.62}.key.on{background:#8fd3ff}.key span{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:9px;font-weight:900}.fx{padding:12px;border:1px solid #fff;border-radius:16px;background:#edf9ff}.fx h3{margin:0 0 8px}.status{font-size:11px;font-weight:900}.bank{min-width:150px;flex:1}.bank select{width:100%}@media(max-width:850px){.oscgrid,.fxgrid{grid-template-columns:1fr}.controls{grid-template-columns:repeat(2,1fr)}} 
</style></head><body><main class="wrap">
<div class="glass top"><div><h1>TRI-OSC FX LAB</h1><div class="status">3 OSCILLATORS · HUGE PATCH BANK · MULTI-FX · MIDI + MOUSE + TOUCH</div></div><div class="row"><a class="btn" href="index.html">← BEAR CAVE</a><button id="audio" class="btn">ENABLE AUDIO</button><button id="midi" class="btn">ENABLE MIDI</button><button id="panic" class="btn">PANIC</button></div></div>
<div class="glass banks"><div class="bank"><label>PATCH BANK</label><select id="bank"></select></div><div class="bank"><label>PATCH</label><select id="patch"></select></div><button id="random" class="btn">RANDOMIZE</button><button id="save" class="btn">SAVE PATCH</button><span id="status" class="status">READY</span></div>
<div class="glass"><h2>OSCILLATORS</h2><div class="oscgrid" id="oscs"></div></div>
<div class="glass"><h2>FILTER · AMP · MOTION</h2><div class="controls" id="global"></div></div>
<div class="glass"><h2>FX RACK</h2><div class="fxgrid" id="fx"></div></div>
<div class="glass"><h2>PLAY</h2><div class="keys" id="keys"></div><div class="status" style="margin-top:9px">KEYBOARD: A W S E D F T G Y H U J K · MIDI NOTES SUPPORTED · MOD WHEEL → FILTER · PITCH BEND SUPPORTED</div></div>
</main><script>
(function(){
var AC=null,master=null,filter=null,comp=null,delay=null,delayFb=null,verb=null,verbGain=null,drive=null,chorus=null,chorusLfo=null,chorusGain=null,voices={},midi=null;
var cfg={master:.55,cutoff:9000,res:.8,attack:.01,decay:.18,sustain:.72,release:.35,drive:.08,delay:.18,feedback:.24,reverb:.16,chorus:.12,chorusRate:.7,osc:[
{wave:"sawtooth",oct:0,semi:0,fine:0,level:.45,pan:-.15},
{wave:"square",oct:-1,semi:0,fine:4,level:.28,pan:.15},
{wave:"triangle",oct:1,semi:7,fine:-3,level:.22,pan:0}]};
var bankDefs={
"BASS":["Sub Cave","Rubber Bear","Acid Fern","Deep Glass","Night Moss","Vista Bass","Dirty Mono","Roundhouse","Blue Sub","Growler","Soft Earth","Pulse Root"],
"LEADS":["Crystal Lead","Sky Saw","Laser Meadow","Glass Reed","Wide Hero","Arcade Vine","Bright Mono","Fifth Runner","Rain Lead","Neon Leaf","Sharp Air","Solar Bell"],
"PADS":["Vista Meadow","Cloud Choir","Lake Glass","Soft Horizon","Greenhouse","Rain Window","Dream Field","Morning Fog","Blue Valley","Warm Air","Forest Glass","Sunset"],
"KEYS":["Soft EP","Glass Keys","Organ Mist","Pluckwood","Digital Piano","Bell Tree","Chime Pad","Toy Keys","Wide EP","Mallet","Soft Square","Air Keys"],
"WEIRD":["Broken Pond","Alien Fern","Bit Garden","Wobble Glass","Detuned Bird","Mud Circuit","Ice Machine","Swamp FM","Bent Window","Static Bloom","Moon Bug","Chaos Reed"]};
function ensure(){if(AC)return;AC=new (AudioContext||webkitAudioContext)();master=AC.createGain();filter=AC.createBiquadFilter();comp=AC.createDynamicsCompressor();drive=AC.createWaveShaper();delay=AC.createDelay(2);delayFb=AC.createGain();verb=AC.createConvolver();verbGain=AC.createGain();chorus=AC.createDelay(.05);chorusLfo=AC.createOscillator();chorusGain=AC.createGain();
master.connect(filter);filter.connect(drive);drive.connect(comp);comp.connect(AC.destination);filter.connect(delay);delay.connect(delayFb);delayFb.connect(delay);delay.connect(comp);filter.connect(verb);verb.connect(verbGain);verbGain.connect(comp);filter.connect(chorus);chorus.connect(comp);chorusLfo.connect(chorusGain);chorusGain.connect(chorus.delayTime);chorusLfo.start();makeIR();apply()}
function curve(a){var n=2048,c=new Float32Array(n),k=a*180,i,x;for(i=0;i<n;i++){x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}return c}
function makeIR(){var len=AC.sampleRate*2,b=AC.createBuffer(2,len,AC.sampleRate);for(var ch=0;ch<2;ch++){var d=b.getChannelData(ch);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}verb.buffer=b}
function apply(){if(!AC)return;master.gain.value=cfg.master;filter.type="lowpass";filter.frequency.value=cfg.cutoff;filter.Q.value=cfg.res;drive.curve=curve(cfg.drive);drive.oversample="4x";delay.delayTime.value=cfg.delay;delayFb.gain.value=cfg.feedback;verbGain.gain.value=cfg.reverb;chorus.delayTime.value=.012;chorusGain.gain.value=.006*cfg.chorus;chorusLfo.frequency.value=cfg.chorusRate}
function noteOn(n,v){ensure();if(voices[n])noteOff(n);var now=AC.currentTime,out=AC.createGain();out.gain.setValueAtTime(.0001,now);out.gain.exponentialRampToValueAtTime(Math.max(.001,v*cfg.sustain),now+cfg.attack);out.connect(master);var os=[];cfg.osc.forEach(function(o){var z=AC.createOscillator(),p=AC.createStereoPanner(),g=AC.createGain(),f=440*Math.pow(2,(n-69+o.oct*12+o.semi+o.fine/100)/12);z.type=o.wave;z.frequency.value=f;g.gain.value=o.level;p.pan.value=o.pan;z.connect(g);g.connect(p);p.connect(out);z.start();os.push(z)});voices[n]={out:out,os:os};}
function noteOff(n){if(!voices[n]||!AC)return;var v=voices[n],t=AC.currentTime;v.out.gain.cancelScheduledValues(t);v.out.gain.setTargetAtTime(.0001,t,Math.max(.02,cfg.release/4));setTimeout(function(){v.os.forEach(function(o){try{o.stop()}catch(e){}});try{v.out.disconnect()}catch(e){}},cfg.release*1200+100);delete voices[n]}
function panic(){Object.keys(voices).forEach(noteOff);document.getElementById("status").textContent="PANIC: ALL NOTES OFF"}
var ctlDefs=[["master","MASTER",0,1,.01],["cutoff","CUTOFF",80,18000,1],["res","RESONANCE",.1,18,.1],["attack","ATTACK",.001,2,.001],["decay","DECAY",.01,2,.01],["sustain","SUSTAIN",.01,1,.01],["release","RELEASE",.02,4,.01]];
function ctlHtml(k,l,min,max,step,val){return '<div class="ctl"><label>'+l+'<span id="'+k+'r">'+Number(val).toFixed(step<.01?3:step<1?2:0)+'</span></label><input id="'+k+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"></div>'}
document.getElementById("global").innerHTML=ctlDefs.map(function(d){return ctlHtml(d[0],d[1],d[2],d[3],d[4],cfg[d[0]])}).join("");
var waves=["sine","triangle","sawtooth","square"];document.getElementById("oscs").innerHTML=cfg.osc.map(function(o,i){return '<div class="osc"><h2>OSC '+(i+1)+'</h2><select id="wave'+i+'">'+waves.map(function(w){return '<option '+(w===o.wave?"selected":"")+'>'+w+'</option>'}).join("")+'</select><div class="controls">'+ctlHtml("oct"+i,"OCTAVE",-3,3,1,o.oct)+ctlHtml("semi"+i,"SEMITONE",-12,12,1,o.semi)+ctlHtml("fine"+i,"FINE",-50,50,1,o.fine)+ctlHtml("level"+i,"LEVEL",0,1,.01,o.level)+ctlHtml("pan"+i,"PAN",-1,1,.01,o.pan)+'</div></div>'}).join("");
var fxDefs=[["drive","DRIVE",0,1,.01],["delay","DELAY",0,.8,.01],["feedback","FEEDBACK",0,.82,.01],["reverb","REVERB",0,.8,.01],["chorus","CHORUS",0,1,.01],["chorusRate","CHORUS RATE",.05,8,.01]];
document.getElementById("fx").innerHTML=fxDefs.map(function(d){return '<div class="fx"><h3>'+d[1]+'</h3>'+ctlHtml(d[0],d[1],d[2],d[3],d[4],cfg[d[0]])+'</div>'}).join("");
function bind(){ctlDefs.concat(fxDefs).forEach(function(d){var e=document.getElementById(d[0]);e.oninput=function(){cfg[d[0]]=+e.value;document.getElementById(d[0]+"r").textContent=(+e.value).toFixed(d[4]<.01?3:d[4]<1?2:0);apply()}});cfg.osc.forEach(function(o,i){document.getElementById("wave"+i).onchange=function(){o.wave=this.value};["oct","semi","fine","level","pan"].forEach(function(k){var e=document.getElementById(k+i);e.oninput=function(){o[k]=+e.value;document.getElementById(k+i+"r").textContent=e.value}})})}bind();
var notes=[60,61,62,63,64,65,66,67,68,69,70,71,72],chars=["A","W","S","E","D","F","T","G","Y","H","U","J","K"];document.getElementById("keys").innerHTML=notes.map(function(n,i){return '<button class="key '+([1,3,6,8,10].indexOf(i)>=0?"black":"")+'" data-n="'+n+'"><span>'+chars[i]+'</span></button>'}).join("");document.querySelectorAll(".key").forEach(function(k){k.onpointerdown=function(){this.classList.add("on");noteOn(+this.dataset.n,.85)};k.onpointerup=k.onpointerleave=function(){this.classList.remove("on");noteOff(+this.dataset.n)}});
var down={};addEventListener("keydown",function(e){var i=chars.indexOf(e.key.toUpperCase());if(i>=0&&!down[e.key]){down[e.key]=1;noteOn(notes[i],.85)}});addEventListener("keyup",function(e){var i=chars.indexOf(e.key.toUpperCase());if(i>=0){delete down[e.key];noteOff(notes[i])}});
var b=document.getElementById("bank"),p=document.getElementById("patch");Object.keys(bankDefs).forEach(function(x){b.add(new Option(x,x))});function fill(){p.innerHTML="";bankDefs[b.value].forEach(function(x,i){p.add(new Option(x,i))})}fill();b.onchange=function(){fill();loadPatch()};
function seeded(name){var s=0;for(var i=0;i<name.length;i++)s=(s*31+name.charCodeAt(i))>>>0;function r(){s=(s*1664525+1013904223)>>>0;return s/4294967296}return r}
function loadPatch(){var name=bankDefs[b.value][+p.value],r=seeded(b.value+name);cfg.osc.forEach(function(o,i){o.wave=waves[Math.floor(r()*waves.length)];o.oct=Math.floor(r()*4)-2;o.semi=[0,0,0,7,12,-12][Math.floor(r()*6)];o.fine=Math.round((r()-.5)*18);o.level=.18+r()*.4;o.pan=(r()-.5)*.7});cfg.cutoff=600+r()*15000;cfg.res=.4+r()*5;cfg.attack=.002+r()*(b.value==="PADS"?1.2:.12);cfg.release=.08+r()*(b.value==="PADS"?2.5:.7);cfg.drive=r()*.38;cfg.delay=r()*.38;cfg.feedback=r()*.42;cfg.reverb=r()*.5;cfg.chorus=r()*.7;cfg.chorusRate=.1+r()*2.4;refresh();document.getElementById("status").textContent=b.value+" · "+name}
function refresh(){cfg.osc.forEach(function(o,i){document.getElementById("wave"+i).value=o.wave;["oct","semi","fine","level","pan"].forEach(function(k){document.getElementById(k+i).value=o[k];document.getElementById(k+i+"r").textContent=Number(o[k]).toFixed(k==="level"||k==="pan"?2:0)})});ctlDefs.concat(fxDefs).forEach(function(d){document.getElementById(d[0]).value=cfg[d[0]];document.getElementById(d[0]+"r").textContent=Number(cfg[d[0]]).toFixed(d[4]<.01?3:d[4]<1?2:0)});apply()}p.onchange=loadPatch;loadPatch();
document.getElementById("audio").onclick=function(){ensure();this.classList.add("on");this.textContent="AUDIO ON"};document.getElementById("panic").onclick=panic;document.getElementById("random").onclick=function(){var r=Math.floor(Math.random()*p.options.length);p.value=r;loadPatch()};document.getElementById("save").onclick=function(){localStorage.setItem("tri-osc-patch",JSON.stringify(cfg));document.getElementById("status").textContent="PATCH SAVED"};
document.getElementById("midi").onclick=async function(){if(!navigator.requestMIDIAccess)return;try{midi=await navigator.requestMIDIAccess();midi.inputs.forEach(function(inp){inp.onmidimessage=function(e){var d=e.data,c=d[0]&240;if(c===144&&d[2])noteOn(d[1],d[2]/127);else if(c===128||(c===144&&!d[2]))noteOff(d[1]);else if(c===176&&d[1]===1){cfg.cutoff=200+(d[2]/127)*17800;refresh()}}});this.classList.add("on");this.textContent="MIDI ON";document.getElementById("status").textContent="MIDI CONNECTED"}catch(e){document.getElementById("status").textContent="MIDI DENIED"}};
})();
</script></body></html>
