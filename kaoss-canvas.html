<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATTBEAR · KAOSS CANVAS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Source+Serif+4:ital,wght@0,700;1,700&display=swap');
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:#12324a;font-family:"Nunito",Segoe UI,sans-serif}
body{
  background:
    radial-gradient(circle at 22% 18%,rgba(255,255,255,.92) 0 5%,rgba(255,255,255,.26) 18%,transparent 34%),
    linear-gradient(180deg,#7fc9ff 0%,#bce8ff 36%,#dff7ff 49%,#8fd17a 50%,#5eb65a 67%,#2f8d4b 100%);
}
body:before{
  content:"";position:fixed;inset:auto -10% -10% -10%;height:44%;
  background:
    radial-gradient(ellipse at 18% 88%,#6cb25e 0 24%,transparent 25%),
    radial-gradient(ellipse at 45% 95%,#4f9d55 0 28%,transparent 29%),
    radial-gradient(ellipse at 76% 90%,#79bf63 0 22%,transparent 23%);
  opacity:.8;pointer-events:none
}
body:after{
  content:"";position:fixed;left:0;right:0;bottom:0;height:18%;
  background:linear-gradient(180deg,rgba(78,150,190,.18),rgba(45,108,153,.48));
  backdrop-filter:blur(2px);pointer-events:none
}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#fx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 35%,rgba(18,54,77,.12));mix-blend-mode:multiply}
.top{position:fixed;z-index:5;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;pointer-events:none}
.brand{pointer-events:auto;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(219,241,255,.72));border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(28,74,103,.24),inset 0 1px 0 rgba(255,255,255,.95);padding:12px 16px;border-radius:20px;backdrop-filter:blur(16px)}
.brand b{font:800 30px/1 "Source Serif 4",Georgia,serif;color:#0f4e74;text-shadow:0 1px 0 #fff}.brand small{display:block;font-size:9px;font-weight:800;letter-spacing:.14em;margin-top:6px;color:#4a738d}
.nav{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.nav a,.btn{border:1px solid rgba(255,255,255,.9);background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(208,235,247,.76));color:#1c4f6e;text-decoration:none;padding:9px 12px;font-weight:800;font-size:11px;border-radius:14px;box-shadow:0 7px 18px rgba(33,81,110,.18),inset 0 1px 0 #fff;cursor:pointer;backdrop-filter:blur(10px)}
.nav a:hover,.btn:hover{background:linear-gradient(180deg,#fff,#dff4ff)}
.panel{position:fixed;z-index:6;left:16px;bottom:16px;width:min(620px,calc(100vw - 32px));background:linear-gradient(180deg,rgba(248,253,255,.88),rgba(214,239,247,.76));border:1px solid rgba(255,255,255,.95);box-shadow:0 18px 45px rgba(26,69,95,.28),inset 0 1px 0 rgba(255,255,255,.95);padding:15px;border-radius:22px;backdrop-filter:blur(20px) saturate(1.15)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn.red{background:linear-gradient(180deg,#f1fbff,#cde8f2);color:#184c67}.btn.blue{background:linear-gradient(180deg,#dff6ff,#9fd8f6);color:#0f557c}.btn.green{background:linear-gradient(180deg,#e4f9dc,#acd99b);color:#245c30}.btn.yellow{background:linear-gradient(180deg,#fff8d6,#f2dc95);color:#665419}.btn.on{box-shadow:0 0 0 3px rgba(122,205,255,.45),0 10px 24px rgba(33,88,121,.2)}
label{font:800 13px "Nunito",sans-serif;color:#275f7c}.control{display:grid;grid-template-columns:60px 1fr 38px;gap:7px;align-items:center;flex:1;min-width:180px}input[type=range]{width:100%;accent-color:#4ca2cf}.read{font-size:10px;font-weight:900;color:#4a7189}
.scenes{position:fixed;z-index:6;right:18px;bottom:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.scene{min-width:100px;height:60px;font:800 15px "Nunito",sans-serif;border:1px solid rgba(255,255,255,.95);border-radius:18px;box-shadow:0 10px 24px rgba(27,72,99,.24),inset 0 1px 0 #fff;cursor:pointer;color:#184862;backdrop-filter:blur(12px)}
.scene:nth-child(1){background:linear-gradient(180deg,rgba(225,245,255,.94),rgba(148,207,240,.84))}
.scene:nth-child(2){background:linear-gradient(180deg,rgba(224,255,246,.94),rgba(121,207,185,.84))}
.scene:nth-child(3){background:linear-gradient(180deg,rgba(240,247,255,.94),rgba(173,196,224,.84))}
.scene:nth-child(4){background:linear-gradient(180deg,rgba(238,255,228,.94),rgba(164,213,127,.84))}
.scene.on{transform:translateY(2px);box-shadow:0 4px 12px rgba(27,72,99,.18),inset 0 0 0 2px rgba(255,255,255,.65)}
.hud{position:fixed;z-index:4;top:106px;left:20px;font:800 12px "Nunito",sans-serif;pointer-events:none}.hud span{display:inline-block;background:rgba(245,252,255,.74);color:#245c7a;padding:6px 9px;margin-right:5px;border:1px solid rgba(255,255,255,.92);border-radius:999px;box-shadow:0 6px 16px rgba(28,74,103,.14);backdrop-filter:blur(10px)}
.help{font-size:10px;font-weight:700;margin-top:10px;line-height:1.45;color:#51758b}
@media(max-width:780px){.scenes{right:16px;top:112px;bottom:auto}.scene{min-width:76px;height:46px;font-size:12px}.panel{padding:11px}.brand b{font-size:25px}.nav a{display:none}}
</style></head>
<body>
<canvas id="c"></canvas><div id="fx"></div>
<div class="top"><div class="brand"><b>KAOSS CANVAS</b><small>MATTBEAR LIVE VISUAL INSTRUMENT</small></div><div class="nav"><a href="index.html">← BEAR CAVE</a><a href="drum-machine.html">DRUM MACHINE</a></div></div>
<div class="hud"><span id="midiStat">MIDI OFF</span><span id="audioStat">AUDIO OFF</span><span id="noteStat">NOTE —</span><span id="actionStat">READY</span></div>
<div class="scenes"><button class="scene on" data-scene="space">SPACE</button><button class="scene" data-scene="liquid">LIQUID</button><button class="scene" data-scene="glitch">GLITCH</button><button class="scene" data-scene="pulse">PULSE</button></div>
<div class="panel">
 <div class="row">
  <button class="btn blue" id="sound">ENABLE SOUND</button><button class="btn blue" id="midi">ENABLE MIDI</button><button class="btn red" id="mic">AUDIO REACTIVE</button>
  <button class="btn yellow" id="freeze">FREEZE</button><button class="btn" id="blackout">BLACKOUT / DROP</button><button class="btn" id="clear">CLEAR</button>
 </div>
 <div class="row" style="margin-top:10px"><div class="control"><label>VOLUME</label><input id="vol" type="range" min="0" max=".8" step=".01" value=".28"><span class="read" id="volR">28%</span></div></div><div class="row" style="margin-top:10px">
  <div class="control"><label>CHAOS</label><input id="chaos" type="range" min="0" max="1" step=".01" value=".25"><span class="read" id="chaosR">25%</span></div>
  <div class="control"><label>TRAIL</label><input id="trail" type="range" min=".02" max=".4" step=".01" value=".12"><span class="read" id="trailR">12</span></div>
  <div class="control"><label>BPM</label><input id="bpm" type="range" min="60" max="200" step="1" value="120"><span class="read" id="bpmR">120</span></div>
 </div>
 <div class="help">DRAG THE CANVAS = XY CONTROL · MIDI NOTES = BURSTS · CC 1 = X · CC 2 = Y · CC 3 = CHAOS · CC 4 = TRAIL · SPACE = DROP · F = FREEZE · 1–4 = SCENES</div>
</div>
<script>
(function(){
var cv=document.getElementById("c"),x=cv.getContext("2d"),W=0,H=0,dpr=1,px=.5,py=.5,tx=.5,ty=.5,scene="space",chaos=.25,trail=.12,bpm=120,frozen=false,black=false,parts=[],amp=0,analyser=null,micStream=null,micCtx=null,midi=null,lastBeat=0,audioCtx=null,master=null,filter=null,drone=null,droneGain=null,soundOn=false,volume=.28;
var cols=["#8fd3ff","#5ea8d9","#8bcf7a","#d9f2ff","#6fb3a2","#ffffff"];
function action(msg){document.getElementById("actionStat").textContent=msg;clearTimeout(action._t);action._t=setTimeout(function(){document.getElementById("actionStat").textContent="READY"},1200)}
function setFreeze(v){frozen=v;document.getElementById("freeze").classList.toggle("on",frozen);document.getElementById("freeze").textContent=frozen?"UNFREEZE":"FREEZE";action(frozen?"FROZEN":"LIVE")}
function setBlack(v){black=v;document.getElementById("blackout").classList.toggle("on",black);document.getElementById("blackout").textContent=black?"RETURN":"BLACKOUT / DROP";action(black?"BLACKOUT":"RETURNED")}
function ensureSound(){
 if(!audioCtx){
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  master=audioCtx.createGain();master.gain.value=volume;
  filter=audioCtx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=2200;filter.Q.value=3;
  master.connect(filter);filter.connect(audioCtx.destination);
 }
 if(audioCtx.state==="suspended")audioCtx.resume();
 return audioCtx
}
function xyFreq(){var scale=[0,2,4,7,9,12,14,16,19,21,24],idx=Math.max(0,Math.min(scale.length-1,Math.floor(px*scale.length)));return 110*Math.pow(2,scale[idx]/12)}
function updateDrone(){
 if(!soundOn||!drone)return;
 var t=audioCtx.currentTime,f=xyFreq();
 drone.frequency.setTargetAtTime(f,t,.03);
 filter.frequency.setTargetAtTime(500+py*6500,t,.05);
 droneGain.gain.setTargetAtTime(.08+(1-py)*.12,t,.05)
}
function noteSound(note,vel){
 if(!soundOn)return;var c=ensureSound(),o=c.createOscillator(),g=c.createGain(),f=440*Math.pow(2,(note-69)/12),t=c.currentTime;
 o.type=scene==="glitch"?"square":scene==="liquid"?"sine":scene==="pulse"?"triangle":"sawtooth";
 o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(Math.max(.02,vel*.22),t);g.gain.exponentialRampToValueAtTime(.0001,t+.35+vel*.55);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+1.2)
}
function startDrone(){
 var c=ensureSound();if(drone){try{drone.stop()}catch(e){}}
 drone=c.createOscillator();droneGain=c.createGain();drone.type="sine";drone.frequency.value=xyFreq();droneGain.gain.value=.001;
 drone.connect(droneGain);droneGain.connect(master);drone.start();updateDrone()
}
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();
function burst(n,vel){
 var count=3+Math.floor((vel||.7)*8),i,a,s;
 for(i=0;i<count;i++){a=Math.random()*Math.PI*2;s=1+Math.random()*5+(vel||.7)*5;parts.push({x:px*W,y:py*H,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:6+Math.random()*24,life:1,c:cols[(n+i)%cols.length],note:n||0})}
 document.getElementById("noteStat").textContent="NOTE "+(n==null?"XY":n)
}
function pointer(e){var r=cv.getBoundingClientRect();tx=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));ty=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));burst(Math.floor(tx*12),.45);updateDrone()}
cv.addEventListener("pointerdown",function(e){cv.setPointerCapture(e.pointerId);pointer(e)});cv.addEventListener("pointermove",function(e){if(e.buttons)pointer(e)});
function drawBg(t){
 if(scene==="space"){x.fillStyle="#dff5ff";x.fillRect(0,0,W,H);for(var i=0;i<40;i++){x.fillStyle=cols[i%5];x.globalAlpha=.12;x.beginPath();x.arc((i*173+t*.02)%W,(i*97)%H,2+(i%3),0,7);x.fill()}x.globalAlpha=1}
 if(scene==="liquid"){x.fillStyle="#9ddfcf";x.fillRect(0,0,W,H);for(var j=0;j<8;j++){x.fillStyle=cols[j%4];x.beginPath();x.arc((Math.sin(t*.0005+j)*.4+.5)*W,(Math.cos(t*.0004+j)*.4+.5)*H,80+j*18,0,7);x.fill()}}
 if(scene==="glitch"){x.fillStyle="#eaf6ff";x.fillRect(0,0,W,H);for(var k=0;k<16;k++){x.fillStyle=cols[k%4];x.fillRect(Math.random()*W,Math.random()*H,30+Math.random()*240,5+Math.random()*45)}}
 if(scene==="pulse"){x.fillStyle="#bfe8a9";x.fillRect(0,0,W,H);var beat=(t%(60000/bpm))/(60000/bpm);for(var q=5;q>0;q--){x.strokeStyle=cols[q%4];x.lineWidth=12;x.beginPath();x.arc(px*W,py*H,(beat*400+q*70)%500,0,7);x.stroke()}}
}
function frame(t){
 requestAnimationFrame(frame);if(frozen)return;
 px+=(tx-px)*.12;py+=(ty-py)*.12;updateDrone();
 if(analyser){var d=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(d);var sum=0;for(var z=0;z<d.length;z++)sum+=d[z];amp=sum/d.length/255;if(amp>.18&&t-lastBeat>110){burst(Math.floor(amp*20),Math.min(1,amp*2));lastBeat=t}}
 x.globalAlpha=1;drawBg(t);
 if(black){x.fillStyle="#000";x.fillRect(0,0,W,H);return}
 x.globalCompositeOperation=scene==="liquid"?"multiply":"source-over";
 for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*(1+chaos);p.y+=p.vy*(1+chaos);p.vx+=(Math.random()-.5)*chaos;p.vy+=(Math.random()-.5)*chaos;p.r*=.995;p.life-=.008+trail*.018;x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.c;
  if(scene==="glitch"){x.fillRect(p.x,p.y,p.r*3,p.r*.6)}else if(scene==="liquid"){x.beginPath();x.arc(p.x,p.y,p.r*(1+amp*3),0,7);x.fill()}else{x.save();x.translate(p.x,p.y);x.rotate(t*.001+p.note);x.fillRect(-p.r,-p.r,p.r*2,p.r*2);x.restore()}
  if(p.life<=0)parts.splice(i,1)
 }
 x.globalAlpha=1;x.globalCompositeOperation="source-over";x.strokeStyle="#ffffff";x.lineWidth=3;x.beginPath();x.arc(px*W,py*H,18+amp*50,0,7);x.stroke();
}
requestAnimationFrame(frame);
document.querySelectorAll(".scene").forEach(function(b){b.onclick=function(){scene=this.dataset.scene;document.querySelectorAll(".scene").forEach(function(z){z.classList.remove("on")});this.classList.add("on");burst(7,.9);action(scene.toUpperCase())}});
document.getElementById("sound").onclick=function(){soundOn=!soundOn;if(soundOn){startDrone();document.getElementById("audioStat").textContent="SYNTH LIVE";this.classList.add("on");this.textContent="SOUND ON";action("SYNTH ON")}else{if(drone){try{drone.stop()}catch(e){}drone=null}document.getElementById("audioStat").textContent=analyser?"INPUT LIVE":"AUDIO OFF";this.classList.remove("on");this.textContent="ENABLE SOUND";action("SYNTH OFF")}};
document.getElementById("vol").oninput=function(){volume=+this.value;document.getElementById("volR").textContent=Math.round(volume*100)+"%";if(master)master.gain.value=volume;action("VOLUME "+Math.round(volume*100)+"%")};
document.getElementById("chaos").oninput=function(){chaos=+this.value;document.getElementById("chaosR").textContent=Math.round(chaos*100)+"%";action("CHAOS "+Math.round(chaos*100)+"%")}
document.getElementById("trail").oninput=function(){trail=+this.value;document.getElementById("trailR").textContent=Math.round(trail*100)+"%";action("TRAIL "+Math.round(trail*100)+"%")};
document.getElementById("bpm").oninput=function(){bpm=+this.value;document.getElementById("bpmR").textContent=bpm;action(bpm+" BPM")};
document.getElementById("freeze").onclick=function(){setFreeze(!frozen)};
document.getElementById("blackout").onclick=function(){setBlack(!black)};
document.getElementById("clear").onclick=function(){parts=[];if(frozen)setFreeze(false);action("CANVAS CLEARED")};
document.getElementById("midi").onclick=async function(){if(!navigator.requestMIDIAccess){document.getElementById("midiStat").textContent="MIDI N/A";return}try{midi=await navigator.requestMIDIAccess();midi.inputs.forEach(function(inp){inp.onmidimessage=function(e){var d=e.data,cmd=d[0]&240,n=d[1],v=d[2]/127;if(cmd===144&&d[2]){burst(n,v);noteSound(n,v)}if(cmd===176){if(n===1){tx=v;updateDrone()}if(n===2){ty=1-v;updateDrone()}if(n===3){chaos=v;document.getElementById("chaos").value=v;document.getElementById("chaosR").textContent=Math.round(v*100)+"%"}if(n===4){trail=.02+v*.38;document.getElementById("trail").value=trail;document.getElementById("trailR").textContent=Math.round(trail*100)+"%"}}}});document.getElementById("midiStat").textContent=midi.inputs.size?"MIDI LIVE":"MIDI READY";this.classList.add("on");this.textContent=midi.inputs.size?"MIDI ON":"MIDI READY";action(midi.inputs.size?"MIDI CONNECTED":"MIDI ENABLED")}catch(e){document.getElementById("midiStat").textContent="MIDI DENIED"}};
document.getElementById("mic").onclick=async function(){
 if(micStream){
  micStream.getTracks().forEach(function(t){t.stop()});micStream=null;analyser=null;
  if(micCtx){try{micCtx.close()}catch(e){}micCtx=null}
  this.classList.remove("on");this.textContent="AUDIO REACTIVE";document.getElementById("audioStat").textContent=soundOn?"SYNTH LIVE":"AUDIO OFF";action("INPUT OFF");return
 }
 try{
  micStream=await navigator.mediaDevices.getUserMedia({audio:true});
  micCtx=new (window.AudioContext||window.webkitAudioContext)();
  var src=micCtx.createMediaStreamSource(micStream);analyser=micCtx.createAnalyser();analyser.fftSize=256;src.connect(analyser);
  document.getElementById("audioStat").textContent="INPUT LIVE";this.classList.add("on");this.textContent="INPUT ON";action("AUDIO INPUT LIVE")
 }catch(e){document.getElementById("audioStat").textContent="AUDIO DENIED";action("INPUT DENIED")}
};
addEventListener("keydown",function(e){if(e.code==="Space"){e.preventDefault();setBlack(!black)}if(e.key.toLowerCase()==="f")setFreeze(!frozen);if("1234".indexOf(e.key)>=0)document.querySelectorAll(".scene")[+e.key-1].click()});
})();
</script></body></html>
