<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATTBEAR – Voice Arcade</title><script src="cave-shell.js" defer></script><style>:root{--ink:#10130f;--case:#c9c2a7;--dark:#282d28;--lcd:#b8d98d;--amber:#ffb21a;--red:#e74430}*{box-sizing:border-box}body{margin:0;background:#161815;color:#171a16;font-family:Verdana,system-ui,sans-serif}.machine{max-width:1100px;margin:18px auto;padding:20px;background:linear-gradient(145deg,#ddd6ba,#9d967f);border:5px solid #353830;box-shadow:0 15px 50px #000;border-radius:18px}.brand{font:700 clamp(26px,5vw,50px) Georgia,serif}.brand small{display:block;font:700 11px Verdana;letter-spacing:4px}.lcd{margin:15px 0;background:var(--lcd);border:8px inset #565b4e;padding:15px;min-height:120px;box-shadow:inset 0 0 25px #526d3c;color:#172114}.lcd h1{margin:0;font:700 28px Georgia}.lcd p{margin:7px 0}.cartridges,.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cart,.pad,.big{border:3px solid #252821;background:#474c42;color:#fff;padding:14px 8px;font-weight:900;min-height:58px;box-shadow:inset 0 -6px #252820,3px 4px #77705e;cursor:pointer}.cart.on{background:var(--amber);color:#211600}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.panel{background:#77715f;border:3px solid #393b34;padding:12px}.panel h2{font:700 17px Georgia;margin:0 0 9px}.xy{height:300px;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#ffef99 0 3%,#d78321 4% 8%,transparent 9%),repeating-linear-gradient(0deg,#1d281c 0 29px,#344533 30px 31px),repeating-linear-gradient(90deg,transparent 0 29px,#a6c47c55 30px 31px);border:7px inset #555;touch-action:none}.big{width:100%;background:#9b3026;font-size:20px}.link{display:block;text-align:center;margin-top:15px;color:#fff;background:#222;padding:12px;text-decoration:none;font-weight:900}.meter{height:16px;background:#252821;border:2px inset #555;margin-top:8px}.meter i{display:block;height:100%;width:38%;background:#b9e66d}@media(max-width:650px){.cartridges,.pads{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.machine{margin:0;border-radius:0;padding:10px}.xy{height:45vh}}</style></head><body><main class="machine"><div class="brand">MATTBEAR – VOICE ARCADE<small>DIGITAL VOCAL PERFORMANCE SYSTEM // 1991-ish</small></div><section class="lcd"><h1 id="mode">LOOPER</h1><p id="desc">Capture phrases, stack loops, punch them in and out.</p><b id="read">READY // BPM 120</b></section><div class="cartridges" id="carts"></div><div class="controls"><section class="panel"><h2>PERFORMANCE PAD</h2><div class="xy" id="xy"></div><div class="meter"><i></i></div></section><section class="panel"><h2>QUICK ACTIONS</h2><div class="pads" id="actions"></div><p><label>BPM <input id="bpm" type="range" min="60" max="190" value="120"></label></p><button class="big" id="capture">● CAPTURE / HOLD</button></section></div><section class="panel"><h2>1–8 PERFORMANCE BANK</h2><div class="pads" id="bank"></div></section><a class="link" href="microphone-fiend.html">OPEN FULL MICROPHONE FIEND LAB →</a></main><script>const modes={LOOPER:['Capture phrases, stack loops, punch them in and out.',['CAPTURE','OVERDUB','HALF','REVERSE']],MUTANT:['Fast voice mutation scenes without digging through twenty knobs.',['MONSTER','TINY','ALIEN','DARK']],ROBOT:['Synthetic voice transformations and hard digital movement.',['ROBOT','RING','CHIP','FREEZE']],GLITCH:['Slice, repeat and wreck recent audio rhythmically.',['STUTTER','SLICE','TAPE','CHAOS']],DUB:['Delay throws, space and rhythmic echoes.',['THROW','FREEZE','SLAP','SPACE']],GRANULAR:['Cloud-style micro-slice performance concept.',['GRAIN','DENSITY','SPREAD','CHAOS']],RADIO:['Broadcast, telephone, megaphone and damaged transmission.',['AM','PHONE','MEGA','BROKEN']],DREAM:['Wide chorus, drifting modulation and huge space.',['CHORUS','PHASE','CLOUD','HOLD']]};let current='LOOPER';const carts=document.querySelector('#carts'),actions=document.querySelector('#actions');function render(){carts.innerHTML=Object.keys(modes).map(k=>`<button class="cart ${k===current?'on':''}" data-m="${k}">${k}</button>`).join('');actions.innerHTML=modes[current][1].map(x=>`<button class="pad">${x}</button>`).join('');document.querySelector('#mode').textContent=current;document.querySelector('#desc').textContent=modes[current][0];carts.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.m;render()});actions.querySelectorAll('button').forEach(b=>b.onpointerdown=()=>{b.classList.add('on');document.querySelector('#read').textContent=current+' // '+b.textContent+' ACTIVE'});actions.querySelectorAll('button').forEach(b=>b.onpointerup=()=>b.classList.remove('on'))}document.querySelector('#bank').innerHTML=Array.from({length:8},(_,i)=>`<button class="pad">${i+1}</button>`).join('');document.querySelector('#bpm').oninput=e=>document.querySelector('#read').textContent=`${current} // BPM ${e.target.value}`;let xy=document.querySelector('#xy'),down=false;function move(e){let r=xy.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));xy.style.setProperty('--x',x*100+'%');xy.style.setProperty('--y',y*100+'%');document.querySelector('#read').textContent=`${current} // X ${Math.round(x*100)} Y ${Math.round(y*100)}`}xy.onpointerdown=e=>{down=true;xy.setPointerCapture(e.pointerId);move(e)};xy.onpointermove=e=>down&&move(e);xy.onpointerup=xy.onpointercancel=()=>down=false;document.querySelector('#capture').onpointerdown=e=>{e.target.textContent='● CAPTURING...';e.target.style.background='#e74430'};document.querySelector('#capture').onpointerup=e=>e.target.textContent='● CAPTURE / HOLD';render()</script></body></html>
